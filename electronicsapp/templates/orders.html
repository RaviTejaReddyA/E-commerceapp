<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container-fluid p-2 bg-warning">
        <ul class="nav justify-content-end">
            <li class="nav-item">
                <a class="nav-link text-white" href="{% url 'homepage' %}">Home</a>
            </li>
        </ul>
        <center>
            <h1>🛒Orders🛒</h1>
        </center>
    </div>
    {% if ordered_items %}
    {% for item in ordered_items %}
    <div>
        <img src="{{ item.product.image.url }}" alt="{{ item.product.proname }}" width="100">
        <h2>{{ item.product.proname }}</h2>
        <p>Price: ₹{{ item.product.proprice }}</p>
        <form action="{% url 'remove_from_orders' item.id %}" method="POST">
            {% csrf_token %}
            <button type="submit">Remove</button>
        </form>
    </div>
    {% endfor %}
    <p>Total Price: ${{ total_price }}</p>
    {% else %}
    <p>No orders yet.</p>
    {% endif %}
    <a class="nav-link" href="{% url 'pay' %}">Paynow</a>
</body>
</html>
